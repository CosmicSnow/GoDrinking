[package]
name = "godrinking"
version = "0.1.0"
description = "goDrinking"
authors = ["you"]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webrtc = "0.14.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots", "url"] }
futures-util = "0.3"
dirs = "6"
socket2 = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Ole", "Win32_System_Variant"] }
windows-capture = "2.0.1"
openh264 = "0.9.8"
openh264-sys2 = "0.9.8"
wasapi = "0.24.0"
opus = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "=0.6.2", default-features = false, features = ["alloc"] }
dispatch2 = { version = "=0.3.1", default-features = false, features = ["alloc", "objc2"] }
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSObject", "NSString", "NSProcessInfo", "NSUUID", "NSValue"] }
opus = "0.3"
core-foundation = "0.10"
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "objc2", "objc2-core-video"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "objc2"] }
objc2-screen-capture-kit = "=0.3.2"
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGWindow"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }

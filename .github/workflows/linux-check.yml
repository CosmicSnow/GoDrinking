name: Linux check

# Compile-only. No graphical session, so this does not start a portal
# dialog or capture frames. Release builds stay on the macOS and Windows
# workflows.

on:
  push:
  pull_request:

jobs:
  check:
    name: cargo check (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libpipewire-0.3-dev \
            libwayland-dev \
            libclang-dev \
            cmake \
            nasm \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: cargo check
        working-directory: app
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo check --features tauri/custom-protocol

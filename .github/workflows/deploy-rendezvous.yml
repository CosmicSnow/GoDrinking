name: Deploy Rendezvous

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-rendezvous.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}/rendezvous" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/arm64 image
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            docker buildx build \
              --platform linux/arm64 \
              --push \
              -t "${IMAGE_NAME}:prod" \
              -t "${IMAGE_NAME}:prod-${GITHUB_SHA}" \
              ./server

  deploy:
    name: Deploy
    runs-on: ${{ vars.DEPLOY_RUNNER || 'godrinking' }}
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}/rendezvous" >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Write .env.production from secret
        working-directory: server
        run: printf '%s\n' "${{ secrets.ENV_RENDEZVOUS_PROD }}" > .env.production

      - name: Pull and deploy
        working-directory: server
        run: |
          docker compose -f docker-compose.app.yml pull
          docker compose -f docker-compose.app.yml stop godrinking-rendezvous-prod || true
          docker compose -f docker-compose.app.yml up -d --force-recreate
          docker image prune -f

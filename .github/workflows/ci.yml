name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  rust:
    # windows-latest on purpose: the incident lives here (OpenH264 SPS
    # profile, Media Foundation fallback) and the live encoder tests are
    # #[cfg(target_os = "windows")].
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          # Same as release.yml: Opus's bundled CMakeLists still declares
          # cmake_minimum_required < 3.5, which stock CMake now rejects.
          CMAKE_POLICY_VERSION_MINIMUM: 3.5

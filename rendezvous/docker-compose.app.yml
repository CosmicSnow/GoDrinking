networks:
  npm:
    external: true

services:
  godrinking-rendezvous-dev:
    profiles: [dev]
    image: ${IMAGE_NAME}:dev
    container_name: godrinking-rendezvous-dev
    restart: unless-stopped
    env_file:
      - .env.dev
    expose:
      - "${PORT:-8787}"
    networks:
      - npm

  godrinking-rendezvous-prod:
    profiles: [prod]
    image: ${IMAGE_NAME}:prod
    container_name: godrinking-rendezvous-prod
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "${PORT:-8787}"
    networks:
      - npm
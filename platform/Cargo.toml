[package]
name = "golive-platform"
version = "0.7.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "GoLive capture platform abstraction: trait, types, converters, capabilities. Zero OS dependencies — backends plug in per OS."

[lib]
name = "golive_platform"
crate-type = ["rlib"]

[dependencies]
# Only pure-Rust serialization: this crate must build everywhere with no OS
# bindings. Backends live in their own crates (platform-macos, ...).
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

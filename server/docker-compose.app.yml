networks:
  main-npm:
    external: true

services:
  godrinking-rendezvous-prod:
    image: ${IMAGE_NAME}:prod
    container_name: godrinking-rendezvous-prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env.production
    expose:
      - "${PORT:-8787}"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:$${PORT:-18790}/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - main-npm
